name: Build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed to create the release on a tag push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RAT
          path: out/*
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # release notes: this version's section of CHANGELOG.md
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          # every release starts as a pre-release; promote it once tested on a device:
          #   gh release edit <tag> --prerelease=false --latest
          gh release create "$TAG" out/* --title "RAT $VERSION" --notes-file notes.md --prerelease --verify-tag
        shell: bash
