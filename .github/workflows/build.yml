name: Build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed to create the release on a tag push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RAT
          path: out/*
      - name: Attach the build to the release (tags only)
        # The release itself is created by the maintainer (so it is published under their name), e.g.:
        #   gh release create v1.2 --prerelease --title "RAT 1.2" --notes-file <(awk ... CHANGELOG.md)
        # This step only uploads the zip and its checksum to it, waiting a few minutes for it to exist.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "Waiting for release $TAG to be created..."; sleep 20
          done
          gh release upload "$TAG" out/* --clobber
        shell: bash
