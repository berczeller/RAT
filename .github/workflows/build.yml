name: Build
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: ./scripts/package.sh
      # Releases are published by hand from this build: the plugin zip is in the RAT artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: RAT
          path: out/*
